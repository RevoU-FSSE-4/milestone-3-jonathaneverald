tags:
  - Accounts
paths:
  /accounts:
    get:
      summary: Get all accounts
      description: Returns a list of accounts associated with the current user.

      responses:
        "200":
          description: A JSON array of account objects
          schema:
            type: object
            properties:
              message:
                type: string
              accounts:
                type: array
                items:
                  $ref: "#/definitions/Account"
definitions:
  Account:
    type: object
    properties:
      id:
        type: integer
      user_id:
        type: integer
      account_type:
        type: string
      account_number:
        type: string
      balance:
        type: number
